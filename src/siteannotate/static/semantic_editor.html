<!doctype html>
<html><head><meta charset="utf-8"><title>SiteAnnotate semantic review</title>
<style>body{font:14px sans-serif;margin:0;background:#20242b;color:#eee;display:grid;grid-template-columns:220px 1fr 220px;height:100vh}aside{padding:12px;background:#2b313b;overflow:auto}main{display:flex;align-items:center;justify-content:center}canvas{background:#101217;border:1px solid #555;width:90%;height:90%}button,select{margin:4px;padding:6px}li{cursor:pointer;padding:4px}li.active{background:#46556b}</style></head>
<body><aside><h3>Frames</h3><ul id="frames"></ul></aside><main><canvas id="cloud" width="1000" height="800"></canvas></main><aside><h3>Semantic label</h3><select id="class"></select><p id="info"></p><button id="save">Save selected</button><p>Click a point to relabel it, then save.</p></aside>
<script>
let frame=null,points=[],labels=[],selected=[],currentClass=1,colors={};
function colorFor(label){let c=colors[String(label)]||[255,255,255];return '#'+c.map(v=>Number(v).toString(16).padStart(2,'0')).join('');}
async function api(path,opts){let r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text());return r.json();}
async function init(){let data=await api('/api/frames');let ul=document.querySelector('#frames');data.frames.forEach((f)=>{let li=document.createElement('li');li.textContent=f.frame_key;li.onclick=()=>load(f.frame_key,li);ul.appendChild(li);});let sel=document.querySelector('#class');data.classes.forEach(c=>{colors[String(c.id)]=c.color;let o=document.createElement('option');o.value=c.id;o.textContent=c.id+' '+c.name;sel.appendChild(o);});sel.onchange=()=>currentClass=Number(sel.value);if(data.frames[0])load(data.frames[0].frame_key,ul.firstChild);}
async function load(key,li){document.querySelectorAll('li').forEach(x=>x.classList.remove('active'));li.classList.add('active');frame=await api('/api/frame/'+key);points=frame.points;labels=frame.labels;selected=[];draw();document.querySelector('#info').textContent=key+' · '+points.length+' displayed points';}
function draw(){let c=document.querySelector('#cloud'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(!points.length)return;let xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),sx=(c.width-30)/(maxx-minx||1),sy=(c.height-30)/(maxy-miny||1);points.forEach((p,i)=>{let x=15+(p[0]-minx)*sx,y=c.height-15-(p[1]-miny)*sy;ctx.fillStyle=colorFor(labels[i]);ctx.fillRect(x,y,3,3);});}
document.querySelector('#cloud').onclick=e=>{if(!points.length)return;let c=e.target,r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height,xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),sx=(c.width-30)/(maxx-minx||1),sy=(c.height-30)/(maxy-miny||1),best=0,dist=1e99;points.forEach((p,i)=>{let px=15+(p[0]-minx)*sx,py=c.height-15-(p[1]-miny)*sy,d=(px-x)**2+(py-y)**2;if(d<dist){dist=d;best=i;}});selected=[frame.display_indices[best]];labels[best]=currentClass;draw();};
document.querySelector('#save').onclick=async()=>{if(!frame)return;let result=await api('/api/frame/'+frame.frame_key+'/label',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({updates:selected.map(index=>({index,label:currentClass})),expected_sha256:frame.sha256})});frame.sha256=result.sha256;alert('saved');};init().catch(e=>alert(e));
</script></body></html>
